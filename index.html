<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yala City Fan Trip</title>
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fan Trip">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E8000B; --red-d:#B80008; --black:#000; --s1:#121212; --s2:#1c1c1c; --line:#2e2e2e;
  --white:#fff; --mute:#a3a3a3; --ok:#34c759; --warn:#ffb020;
  --head:'Kanit','Noto Sans Thai',sans-serif; --body:'Noto Sans Thai','Kanit',sans-serif;
  --pad:max(16px,env(safe-area-inset-left));
}
html{color-scheme:dark}html[data-theme=light]{color-scheme:light}
html[data-theme=light]{--black:#f5f3f3;--s1:#fff;--s2:#ececec;--line:#d6d2d2;--white:#111;--mute:#5c5c5c;--warn:#b86e00;--ok:#1f9d43}
html[data-theme=light] .err{color:#c40009}
html[data-theme=light] .btn.danger{color:var(--red-d)}
html[data-theme=light] .toast{background:#111;color:#fff}
html[data-theme=light] .veil{background:rgba(0,0,0,.5)}
html[data-theme=light] .badge.full{color:#fff}
html[data-theme=light] .chk.on{color:#fff}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
html{background:var(--black)}body{background:var(--black);color:var(--white);font:400 16px/1.55 var(--body);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--white);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 var(--pad)}
h1,h2,h3{font-family:var(--head);font-weight:600;line-height:1.25}
.top{display:flex;align-items:center;gap:12px;padding:14px 0;padding-top:calc(14px + env(safe-area-inset-top))}
.top img{width:44px;height:auto;display:block}
.top{gap:8px}.top .t{flex:1;min-width:0}.top .icon{width:44px;height:44px}
.top .t b{font:600 20px/1.2 var(--head);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t small{color:var(--mute);font-size:14px}
.ic{width:1.35em;height:1.35em;display:inline-block;vertical-align:middle;flex:none}.ic *{stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}.ic .f{fill:currentColor}
.icon{width:48px;height:48px;border-radius:14px;background:var(--s2);display:grid;place-items:center;font-size:20px}
.btn{min-height:52px;padding:0 22px;border-radius:14px;font:600 17px var(--head);display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--red);color:#fff;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--s2);border:1px solid var(--line);color:var(--white)}
.btn.line{background:none;border:2px solid var(--red)}
.btn.danger{background:none;border:2px solid var(--red);color:#ff6b72}
.btn.block{width:100%}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px;border-radius:12px}
.btn[disabled]{opacity:.5}
/* ลูกไก่ตัวนับ */
.meter{position:sticky;top:0;z-index:5;background:var(--black);padding:10px 0 12px;border-bottom:1px solid var(--line)}
.meter .row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.meter .big{font:700 40px/1 var(--head)}
.meter .big i{font-style:normal;color:var(--mute);font-weight:500;font-size:26px}
.meter .txt{font-size:15px;color:var(--mute)}
.meter .txt b{color:var(--white)}
.bar{height:12px;border-radius:99px;background:var(--s2);overflow:hidden;margin-top:10px}
.bar>div{height:100%;background:var(--red);border-radius:99px;transition:width .3s}
.bar.full>div{background:var(--warn)}
.bar.over>div{background:var(--warn)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--s1);padding:6px;border-radius:16px;margin:14px 0}
.tabs button{min-height:48px;border-radius:12px;font:600 17px var(--head);color:var(--mute)}
.tabs button[aria-selected=true]{background:var(--red);color:#fff}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px}
.trip{display:block;width:100%;text-align:left;margin-bottom:12px;position:relative;overflow:hidden}
.trip h3{font-size:19px;margin-bottom:4px;padding-right:70px}
.trip p{color:var(--mute);font-size:15px}
.badge{display:inline-block;padding:2px 12px;border-radius:99px;font:600 14px var(--head);background:var(--red);color:#fff}
.badge.full{background:var(--warn);color:#000}.badge.past{background:var(--s2);color:var(--mute);border:1px solid var(--line)}
.trip .badge{position:absolute;top:16px;right:16px}
.trip .num{font:700 24px var(--head);margin-top:10px}.trip .num span{font-size:15px;font-weight:500;color:var(--mute)}
label{display:block;font-weight:500;margin:14px 0 6px}
label small{color:var(--mute);font-weight:400}
::placeholder{color:var(--mute);opacity:.8}
input,textarea{width:100%;min-height:52px;background:var(--s2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:17px}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus{border-color:var(--red);outline:none}
.err{color:#ff7a80;font-size:14px;margin-top:6px;min-height:0}
.hint{color:var(--mute);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stats div{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:6px 2px;text-align:center}
.stats b{display:block;font:700 18px/1.1 var(--head)}.stats span{font-size:12px;color:var(--mute)}
.listbar input{min-height:44px;font-size:16px;padding:8px 12px;border-radius:12px}
.seg{display:flex;gap:6px;margin:8px 0 10px;overflow-x:auto}
.seg button{flex:1;min-height:36px;border-radius:99px;border:1px solid var(--line);background:var(--s1);padding:0 12px;white-space:nowrap;color:var(--mute);font-weight:500;font-size:14px}
.seg button[aria-pressed=true]{background:var(--white);color:var(--black);border-color:var(--white)}
table{width:100%;border-collapse:collapse}
thead{display:none}
tr.p{display:grid;grid-template-columns:26px 1fr auto;column-gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:7px 8px 7px 10px;margin-bottom:6px;align-items:center}
tr.p.in{border-color:var(--ok)}
td{display:block;min-width:0}
td.no{grid-column:1;grid-row:1/4;font:600 13px var(--head);color:var(--mute)}
td.nm{grid-column:2;grid-row:1;font:600 16px/1.3 var(--head)}
td.ph{grid-column:2;grid-row:2;font-size:15px}
td.ad{grid-column:2;grid-row:3;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.tm,td.ac{display:none}
td.st{grid-column:3;grid-row:1/4}
.namebtn{font:inherit;color:inherit;text-align:left;padding:0;min-height:26px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
td.ph a{color:var(--white);font-weight:600;text-decoration:none;border-bottom:2px solid var(--red)}
.chk{min-width:82px;min-height:44px;padding:0 8px;border-radius:12px;border:2px solid var(--line);background:var(--s2);font:600 15px var(--head);color:var(--mute);display:inline-flex;align-items:center;justify-content:center;gap:4px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#000}
@media(min-width:720px){
  .wrap{max-width:1000px}
  thead{display:table-header-group}
  th{text-align:left;font-weight:500;color:var(--mute);font-size:14px;padding:8px 10px;border-bottom:1px solid var(--line)}
  tr.p{display:table-row;background:none;border:0;border-radius:0;padding:0;margin:0}
  td,td.tm,td.ac{display:table-cell;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  td.ad{white-space:normal;font-size:15px}
  td.tm{font-size:14px;color:var(--mute)}
  td.ac{white-space:nowrap}td.ac .btn{margin-right:6px}
  td.st{text-align:right}
  tr.p.in td{background:rgba(52,199,89,.08)}
}
.empty{text-align:center;color:var(--mute);padding:36px 12px}
.empty b{display:block;color:var(--white);font:600 19px var(--head);margin-bottom:6px}
.fab{margin:10px 0 18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#000;font-weight:600;padding:12px 20px;border-radius:99px;z-index:50;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.6)}
.toast.bad{background:var(--red);color:#fff}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--s1);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:720px){.veil{align-items:center}.sheet{border-radius:22px}}
.sheet h2{font-size:21px;margin-bottom:4px}
.sheet .acts{display:flex;gap:10px;margin-top:20px}.sheet .acts .btn{flex:1}
.center{min-height:100vh;display:grid;place-items:center;padding:24px}
.login{width:100%;max-width:380px;text-align:center}
.login img{width:120px;margin-bottom:10px}
.login h1{font-size:28px}.login p{color:var(--mute);margin:6px 0 16px}
.login input{text-align:center;margin-bottom:12px}
.spin{width:36px;height:36px;border:4px solid var(--s2);border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 40px}
.warnbox{background:rgba(255,176,32,.12);border:1px solid var(--warn);border-radius:14px;padding:12px;margin-top:12px;font-size:15px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff;color:#000}.top .icon,.meter .bar,.tabs,.seg,.tools,.stats,.ac,.st,.btn,.fab,.toast{display:none!important}
  .meter{position:static;background:none;border-color:#000}.meter .txt,.meter .big i{color:#000}
  thead{display:table-header-group}tr.p{display:table-row;background:none;border:0}
  td,th{display:table-cell!important;color:#000!important;border-bottom:1px solid #999;padding:6px;font-size:12pt;grid-column:auto}
  td.ph a{color:#000;border:0}
}

tr.p.tmp{opacity:.55}
.hint a{color:var(--white)}
.codebox{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:14px/1.5 monospace;word-break:break-all;text-align:left}
</style>
</head>
<body>
<div id="app"><div class="center"><div><div class="spin"></div><p class="hint">กำลังโหลด…</p></div></div></div>
<noscript><p style="padding:24px">ต้องเปิด JavaScript เพื่อใช้งานแอปนี้</p></noscript>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
